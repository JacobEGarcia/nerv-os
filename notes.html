<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(localStorage.getItem('nerv-theme')==='green')document.documentElement.classList.add('green');</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NERV OS — LOG</title>
<meta name="theme-color" content="#080502">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nerv.css">
<style>
.layout{display:grid; grid-template-columns:280px 1fr; gap:18px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.note-item{border-bottom:1px dashed var(--hair-dim); padding:9px 4px; cursor:pointer}
.note-item:hover{background:rgba(87,255,143,.05)}
.note-item.on{border-left:3px solid var(--ink); padding-left:8px; background:rgba(87,255,143,.06)}
.note-item .nt{color:var(--ink-hi); font-size:13px; letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.note-item .nd{font-size:9px; color:var(--ink-dim); letter-spacing:.2em; margin-top:2px}
#n-title{background:#000; border:1px solid var(--hair); border-bottom:0; color:var(--ink-hi); padding:10px; font-size:15px; font-weight:600; letter-spacing:.08em; width:100%}
#n-body{background:#000; border:1px solid var(--hair); color:var(--ink); width:100%; min-height:340px; padding:12px; resize:vertical; line-height:1.7}
#n-body:focus,#n-title:focus{outline:0; border-color:var(--ink-dim); box-shadow:0 0 10px var(--glow2)}
.bar{display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <div class="phead">
    <h1 class="glow">FIELD LOG</h1><span class="jp">記録</span>
    <div class="code">MODULE 04<br>RECORD KEEPING</div>
  </div>
  <div class="layout">
    <div class="panel tickbox">
      <div class="cap">ENTRIES — 記録一覧</div>
      <input class="inp" id="q" placeholder="SEARCH ENTRIES" style="margin-bottom:8px">
      <button class="btn solid" id="n-new" style="width:100%">+ NEW ENTRY</button>
      <div id="entries" style="margin-top:8px; max-height:420px; overflow:auto"></div>
    </div>
    <div class="panel">
      <div class="cap">ENTRY — 内容</div>
      <input id="n-title" placeholder="ENTRY TITLE" maxlength="80">
      <textarea id="n-body" placeholder="Begin record. Autosaves as you type."></textarea>
      <div class="bar">
        <span class="small dim" id="n-meta">—</span>
        <span style="flex:1"></span>
        <button class="btn" id="n-dl">EXPORT .TXT</button>
        <button class="btn danger" id="n-del">DELETE</button>
      </div>
    </div>
  </div>
</main>
<script src="nerv.js"></script>
<script>
NERV.shell('LOG');
let notes = NERV.store.get('notes', []);
let cur = null, q = '';
function save(){ NERV.store.set('notes', notes); }
function fmtTs(ts){
  const d = new Date(ts);
  return d.getFullYear()+'.'+NERV.two(d.getMonth()+1)+'.'+NERV.two(d.getDate())+' '+NERV.two(d.getHours())+':'+NERV.two(d.getMinutes());
}
function renderList(){
  const box = document.getElementById('entries');
  const shown = notes.filter(n => !q || (n.title+' '+n.body).toLowerCase().includes(q));
  box.innerHTML = shown.length ? '' : '<div class="small dim" style="padding:8px 0">NO ENTRIES.</div>';
  shown.forEach(n=>{
    const d = document.createElement('div');
    d.className = 'note-item' + (n===cur ? ' on' : '');
    d.innerHTML = '<div class="nt"></div><div class="nd"></div>';
    d.querySelector('.nt').textContent = n.title || 'UNTITLED';
    d.querySelector('.nd').textContent = fmtTs(n.ts);
    d.onclick = ()=>{ select(n); NERV.blip(1000,.03); };
    box.appendChild(d);
  });
}
function select(n){
  cur = n;
  document.getElementById('n-title').value = n ? n.title : '';
  document.getElementById('n-body').value = n ? n.body : '';
  paintMeta(); renderList();
}
function paintMeta(){
  const el = document.getElementById('n-meta');
  if(!cur){ el.textContent='NO ENTRY SELECTED'; return; }
  const words = (cur.body.match(/\S+/g)||[]).length;
  el.textContent = 'EDITED '+fmtTs(cur.ts)+' — '+words+' WORDS — SAVED';
}
document.getElementById('n-new').onclick = ()=>{
  const n = {title:'', body:'', ts:Date.now()};
  notes.unshift(n); save(); select(n);
  document.getElementById('n-title').focus();
  NERV.blip(1300,.05);
};
let saveT;
function edit(){
  if(!cur) return;
  cur.title = document.getElementById('n-title').value;
  cur.body = document.getElementById('n-body').value;
  cur.ts = Date.now();
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ save(); paintMeta(); renderList(); }, 300);
}
document.getElementById('n-title').addEventListener('input', edit);
document.getElementById('n-body').addEventListener('input', edit);
document.getElementById('q').addEventListener('input', function(){ q = this.value.trim().toLowerCase(); renderList(); });
document.getElementById('n-del').onclick = ()=>{
  if(!cur) return;
  notes.splice(notes.indexOf(cur),1); save(); select(notes[0]||null);
};
document.getElementById('n-dl').onclick = ()=>{
  if(!cur) return;
  const blob = new Blob([(cur.title||'UNTITLED')+'\n\n'+cur.body], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (cur.title||'nerv-log').replace(/[^\w\-]+/g,'-').toLowerCase()+'.txt';
  a.click(); URL.revokeObjectURL(a.href);
};
if(!notes.length){ notes.push({title:'FIRST ENTRY', body:'Systems nominal. Begin your record here.', ts:Date.now()}); save(); }
select(notes[0]);
</script>
</body>
</html>
